version: '3.8'

services:
  # Backend API
  backend:
    build: ./backend
    ports:
      - "8080:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/innerself
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key}
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend React App  
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    command: npm start

  # GitHub Integration Service
  github-service:
    build: ./github-service
    ports:
      - "8081:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/innerself
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    volumes:
      - ./github-service:/app
    depends_on:
      - mongodb
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=innerself

volumes:
  mongodb_data: